<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mando</title>
<style>
  :root {
    --bg: #0E1633;
    --panel: #182150;
    --edge: #2C3873;
    --ink: #E6EAF7;
    --muted: #8B96C4;
    --bad: #FF6B7A;
    --me: #3FE0C8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  body {
    padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
  }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.on { display: flex; }

  /* ---------- Código ---------- */
  #join { justify-content: center; text-align: center; }
  #join h1 { font-size: 23px; margin: 0 0 6px; }
  #join p { color: var(--muted); font-size: 15px; margin: 0 0 24px; }
  #codeIn {
    width: 100%; padding: 16px; font-size: 38px; font-weight: 700;
    font-family: "Courier New", monospace; text-align: center;
    letter-spacing: 0.2em; text-transform: uppercase;
    background: var(--panel); color: var(--ink);
    border: 2px solid var(--edge); border-radius: 12px;
  }
  #codeIn:focus { outline: none; border-color: var(--me); }
  #go {
    width: 100%; margin-top: 12px; padding: 17px;
    font-size: 17px; font-weight: 700; font-family: inherit;
    background: var(--me); color: #06231F; border: 0; border-radius: 12px;
  }
  #err { color: var(--bad); font-size: 15px; margin-top: 12px; min-height: 20px; }

  /* ---------- Mando ---------- */
  #head { display: flex; align-items: center; padding: 8px 4px 6px; }
  #tag { font-size: 16px; font-weight: 700; color: var(--me); flex: 1; }
  #lat { font-family: "Courier New", monospace; font-size: 13px; color: var(--muted); }

  #surface { flex: 1; position: relative; }

  /* El stick vive abajo a la izquierda, los botones abajo a la derecha:
     es donde caen los pulgares al sostener el teléfono con dos manos. */
  #base {
    position: absolute; left: 4%; bottom: 6%;
    width: 46vw; height: 46vw; max-width: 240px; max-height: 240px;
    border-radius: 50%;
    background: var(--panel); border: 2px solid var(--edge);
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 42%; height: 42%; margin-left: -21%; margin-top: -21%;
    border-radius: 50%; background: var(--me);
  }
  .btn {
    position: absolute; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700;
    border: 2px solid var(--edge); background: var(--panel); color: var(--ink);
  }
  #btnA {
    right: 4%; bottom: 16%;
    width: 30vw; height: 30vw; max-width: 150px; max-height: 150px;
  }
  #btnB {
    right: 34%; bottom: 5%;
    width: 23vw; height: 23vw; max-width: 116px; max-height: 116px;
  }
  #btnA.down { background: var(--me); color: #06231F; border-color: var(--me); }
  #btnB.down { background: var(--ink); color: #0E1633; border-color: var(--ink); }
  .cap { position: absolute; width: 100%; text-align: center; bottom: -22px; font-size: 12px; color: var(--muted); }

  #hint {
    position: absolute; left: 0; right: 0; top: 8%;
    text-align: center; color: var(--muted); font-size: 15px; line-height: 1.45;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="join" class="screen on">
  <h1>Mando</h1>
  <p>Escribe el código que aparece en el televisor.</p>
  <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
  <button id="go">Conectar</button>
  <div id="err"></div>
</div>

<div id="play" class="screen">
  <div id="head">
    <div id="tag">Jugador —</div>
    <div id="lat">—</div>
  </div>
  <div id="surface">
    <div id="hint">Apunta con el stick.<br>A acelera, B frena.</div>
    <div id="base"><div id="knob"></div></div>
    <div id="btnB" class="btn">B<span class="cap">frenar</span></div>
    <div id="btnA" class="btn">A<span class="cap">acelerar</span></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var el = function (id) { return document.getElementById(id); };
  var ws = null, pc = null, dc = null;

  var stick = { x: 0, y: 0 };      // -1..1, y positivo hacia abajo
  var btn = { a: 0, b: 0 };
  var slot = null;
  var seq = 0, pending = {}, samples = [];

  var params = new URLSearchParams(location.search);
  if (params.get('c')) el('codeIn').value = params.get('c').toUpperCase();

  el('go').addEventListener('click', connect);
  el('codeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') connect(); });

  function connect() {
    var code = el('codeIn').value.toUpperCase().trim();
    if (code.length !== 4) { el('err').textContent = 'El código tiene 4 letras.'; return; }
    el('err').textContent = 'Conectando…';

    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    ws.onopen = function () { ws.send(JSON.stringify({ t: 'join', code: code })); };
    ws.onerror = function () { el('err').textContent = 'No se pudo conectar al servidor.'; };

    ws.onmessage = function (ev) {
      var msg = JSON.parse(ev.data);
      if (msg.t === 'error') {
        el('err').textContent = msg.reason === 'nocode'
          ? 'Ese código no existe. Revisa el televisor.'
          : 'Esa partida ya tiene dos jugadores.';
        ws.close();
        return;
      }
      if (msg.t === 'joined') {
        slot = msg.slot;
        document.documentElement.style.setProperty('--me', slot === 0 ? '#FFB020' : '#3FE0C8');
        el('tag').textContent = 'Jugador ' + (slot + 1);
        el('join').className = 'screen';
        el('play').className = 'screen on';
        startRTC();
        return;
      }
      if (msg.t === 'gone') { el('lat').textContent = 'el televisor se fue'; return; }
      if (msg.t === 'signal') { onSignal(msg.data); return; }
    };
  }

  // -------------------------------------------------------------------------
  // WebRTC: canal sin orden ni reintentos. Un input viejo no sirve de nada.
  // -------------------------------------------------------------------------
  function startRTC() {
    if (typeof RTCPeerConnection === 'undefined') { el('lat').textContent = 'sin WebRTC'; return; }
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

    pc.onicecandidate = function (e) {
      if (e.candidate) ws.send(JSON.stringify({ t: 'signal', data: { ice: e.candidate } }));
    };
    pc.oniceconnectionstatechange = function () {
      if (pc.iceConnectionState === 'failed') el('lat').textContent = 'por el servidor';
    };

    dc = pc.createDataChannel('input', { ordered: false, maxRetransmits: 0 });
    dc.onmessage = function (ev) {
      var t0 = pending[JSON.parse(ev.data).s];
      if (t0 === undefined) return;
      samples.push(performance.now() - t0);
      if (samples.length > 120) samples.shift();
    };

    pc.createOffer()
      .then(function (o) { return pc.setLocalDescription(o); })
      .then(function () { ws.send(JSON.stringify({ t: 'signal', data: { sdp: pc.localDescription } })); })
      .catch(function () { el('lat').textContent = 'por el servidor'; });
  }

  function onSignal(data) {
    if (!pc) return;
    if (data.sdp) pc.setRemoteDescription(new RTCSessionDescription(data.sdp)).catch(function () {});
    else if (data.ice) pc.addIceCandidate(new RTCIceCandidate(data.ice)).catch(function () {});
  }

  // -------------------------------------------------------------------------
  // Envío a 60 Hz
  // -------------------------------------------------------------------------
  function r3(n) { return Math.round(n * 1000) / 1000; }

  var lastRtt = null;

  setInterval(function () {
    var s = ++seq;
    var p = { s: s, x: r3(stick.x), y: r3(stick.y), a: btn.a, b: btn.b };
    if (lastRtt !== null && s % 30 === 0) p.r = lastRtt;   // 2 veces por segundo
    if (dc && dc.readyState === 'open') {
      pending[s] = performance.now();
      dc.send(JSON.stringify(p));
    } else if (ws && ws.readyState === 1) {
      p.t = 'r';
      ws.send(JSON.stringify(p));
    }
  }, 16);

  setInterval(function () {
    var now = performance.now();
    for (var k in pending) if (now - pending[k] > 1500) delete pending[k];
    if (!samples.length) return;
    var s = samples.slice().sort(function (a, b) { return a - b; });
    lastRtt = Math.round(s[Math.floor(s.length / 2)]);
    el('lat').textContent = lastRtt + ' ms';
  }, 500);

  // -------------------------------------------------------------------------
  // Multitáctil. Cada dedo se sigue por su identificador, si no el stick se
  // suelta solo al apretar un botón, que es el error clásico de estos mandos.
  // -------------------------------------------------------------------------
  var base = el('base'), knob = el('knob'), hint = el('hint');
  var stickTouch = null;   // identificador del dedo que maneja el stick
  var btnTouch = { a: null, b: null };

  function center() {
    var r = base.getBoundingClientRect();
    return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, rad: r.width / 2 };
  }

  function moveStick(clientX, clientY) {
    var c = center();
    var dx = clientX - c.cx, dy = clientY - c.cy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var limit = c.rad * 0.72;          // el pomo no se sale del aro
    if (dist > limit) { dx *= limit / dist; dy *= limit / dist; dist = limit; }
    stick.x = dx / limit;
    stick.y = dy / limit;
    knob.style.left = 'calc(50% + ' + dx + 'px)';
    knob.style.top = 'calc(50% + ' + dy + 'px)';
    hint.style.display = 'none';
  }

  function releaseStick() {
    stick.x = 0; stick.y = 0; stickTouch = null;
    knob.style.left = '50%'; knob.style.top = '50%';
  }

  function inCircle(elm, x, y) {
    var r = elm.getBoundingClientRect();
    var dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
    return Math.sqrt(dx * dx + dy * dy) <= r.width / 2;
  }

  function press(which, on) {
    btn[which] = on ? 1 : 0;
    el(which === 'a' ? 'btnA' : 'btnB').className = 'btn' + (on ? ' down' : '');
  }

  // El stick se toma desde cualquier punto de la mitad izquierda, no solo
  // desde dentro del aro. Con el pulgar es mucho más fácil de agarrar.
  function stickZone(x) { return x < window.innerWidth * 0.5; }

  document.addEventListener('touchstart', function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (inCircle(el('btnA'), t.clientX, t.clientY)) { btnTouch.a = t.identifier; press('a', true); }
      else if (inCircle(el('btnB'), t.clientX, t.clientY)) { btnTouch.b = t.identifier; press('b', true); }
      else if (stickTouch === null && stickZone(t.clientX)) { stickTouch = t.identifier; moveStick(t.clientX, t.clientY); }
    }
    if (el('play').className.indexOf('on') !== -1) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === stickTouch) moveStick(t.clientX, t.clientY);
    }
    if (el('play').className.indexOf('on') !== -1) e.preventDefault();
  }, { passive: false });

  function end(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var id = e.changedTouches[i].identifier;
      if (id === stickTouch) releaseStick();
      if (id === btnTouch.a) { btnTouch.a = null; press('a', false); }
      if (id === btnTouch.b) { btnTouch.b = null; press('b', false); }
    }
  }
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);

  // Ratón, solo para poder probar desde un computador
  var mouseDown = false;
  document.addEventListener('mousedown', function (e) {
    if (inCircle(el('btnA'), e.clientX, e.clientY)) return press('a', true);
    if (inCircle(el('btnB'), e.clientX, e.clientY)) return press('b', true);
    if (stickZone(e.clientX)) { mouseDown = true; moveStick(e.clientX, e.clientY); }
  });
  document.addEventListener('mousemove', function (e) { if (mouseDown) moveStick(e.clientX, e.clientY); });
  document.addEventListener('mouseup', function () {
    mouseDown = false; releaseStick(); press('a', false); press('b', false);
  });

  // Teclado, mismo motivo
  document.addEventListener('keydown', function (e) {
    if (e.key === 'z' || e.key === ' ') press('a', true);
    if (e.key === 'x') press('b', true);
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === 'z' || e.key === ' ') press('a', false);
    if (e.key === 'x') press('b', false);
  });
})();
</script>
</body>
</html>
