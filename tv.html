<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade</title>
<style>
  :root {
    --bg: #0E1633;
    --panel: #182150;
    --edge: #2C3873;
    --ink: #E6EAF7;
    --muted: #8B96C4;
    --p1: #FFB020;
    --p2: #3FE0C8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  #lobby { padding: 6vh 5vw; text-align: center; }
  .lead { font-size: 2.3vw; color: var(--muted); margin-bottom: 1vh; }
  #url { font-size: 3.8vw; font-weight: 700; color: var(--p2); margin-bottom: 3vh; word-break: break-all; }
  #code {
    font-family: "Courier New", monospace; font-size: 14vw; font-weight: 700;
    line-height: 1; letter-spacing: 0.12em; text-indent: 0.12em; margin-bottom: 3vh;
  }
  .seats { display: flex; justify-content: center; }
  .seat { width: 24vw; padding: 1.6vh 1vw; margin: 0 1vw; background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; }
  .seat.p1 { border-left: 0.8vw solid var(--p1); }
  .seat.p2 { border-left: 0.8vw solid var(--p2); }
  .who { font-size: 1.9vw; font-weight: 700; }
  .st { font-size: 1.4vw; color: var(--muted); margin-top: 0.5vh; }

  #screen { display: none; position: relative; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<div id="lobby">
  <div class="lead">Abre esta dirección en el celular</div>
  <div id="url">…</div>
  <div id="code">····</div>
  <div class="seats">
    <div class="seat p1"><div class="who">Jugador 1</div><div class="st" id="st0">esperando</div></div>
    <div class="seat p2"><div class="who">Jugador 2</div><div class="st" id="st1">esperando</div></div>
  </div>
</div>

<div id="screen"><canvas id="cv"></canvas></div>

<script>
// ===========================================================================
// SDK
//
// Los juegos se registran aquí y el shell les da el reloj, el canvas y el
// estado de los mandos. Un juego nunca toca la red ni sabe que existe WebRTC.
// Esa frontera es lo que permite añadir el cuarto juego sin tocar nada más.
// ===========================================================================
window.Arcade = {
  games: [],
  register: function (game) { window.Arcade.games.push(game); },
  COLORS: ['#FFB020', '#3FE0C8'],
  BG: '#0E1633', PANEL: '#182150', EDGE: '#2C3873',
  INK: '#E6EAF7', MUTED: '#8B96C4', WARN: '#FF6B7A'
};
</script>

<script src="games/coins.js"></script>
<script src="games/shooter.js"></script>
<script src="games/racer3d.js"></script>

<script>
(function () {
  'use strict';

  var el = function (id) { return document.getElementById(id); };
  var ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

  var peers  = [null, null];
  var pads   = [null, null];
  var prev   = [null, null];   // estado anterior, para detectar flancos
  var edges  = [{ a: false, b: false }, { a: false, b: false }];
  var rtt    = [null, null];
  var joined = [false, false];

  el('url').textContent = location.host + '/pad';

  // -------------------------------------------------------------------------
  // Red
  // -------------------------------------------------------------------------
  ws.onopen = function () { ws.send('{"t":"host"}'); };

  ws.onmessage = function (ev) {
    var text = ev.data;
    if (text.lastIndexOf('{"t":"r"', 0) === 0) {
      var inp = JSON.parse(text);
      pads[inp.p] = inp;
      if (inp.r !== undefined) rtt[inp.p] = inp.r;
      return;
    }
    var msg = JSON.parse(text);
    if (msg.t === 'room') { el('code').textContent = msg.code; return; }
    if (msg.t === 'peer') { el('st' + msg.slot).textContent = 'conectando'; startRTC(msg.slot); return; }
    if (msg.t === 'left') { el('st' + msg.slot).textContent = 'se fue'; joined[msg.slot] = false; pads[msg.slot] = null; return; }
    if (msg.t === 'signal') { onSignal(msg.slot, msg.data); return; }
  };

  function ready(slot) {
    if (joined[slot]) return;
    joined[slot] = true;
    el('st' + slot).textContent = 'listo';
    if (mode === 'lobby') { mode = 'menu'; el('lobby').style.display = 'none'; el('screen').style.display = 'block'; size(); }
  }

  function startRTC(slot) {
    if (typeof RTCPeerConnection === 'undefined') { el('st' + slot).textContent = 'sin WebRTC'; ready(slot); return; }
    var pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    peers[slot] = { pc: pc };

    pc.onicecandidate = function (e) {
      if (e.candidate) ws.send(JSON.stringify({ t: 'signal', slot: slot, data: { ice: e.candidate } }));
    };
    pc.oniceconnectionstatechange = function () {
      if (pc.iceConnectionState === 'failed') { el('st' + slot).textContent = 'por el servidor'; ready(slot); }
    };
    pc.ondatachannel = function (e) {
      var dc = e.channel;
      dc.onopen = function () { ready(slot); };
      dc.onmessage = function (m) {
        var p = JSON.parse(m.data);
        pads[slot] = p;
        if (p.r !== undefined) rtt[slot] = p.r;
        dc.send('{"s":' + p.s + '}');
      };
    };
    setTimeout(function () {
      if (!joined[slot]) { el('st' + slot).textContent = 'por el servidor'; ready(slot); }
    }, 6000);
  }

  function onSignal(slot, data) {
    var peer = peers[slot];
    if (!peer) return;
    if (data.sdp) {
      peer.pc.setRemoteDescription(new RTCSessionDescription(data.sdp))
        .then(function () { return peer.pc.createAnswer(); })
        .then(function (a) { return peer.pc.setLocalDescription(a); })
        .then(function () { ws.send(JSON.stringify({ t: 'signal', slot: slot, data: { sdp: peer.pc.localDescription } })); })
        .catch(function () { el('st' + slot).textContent = 'falló la conexión directa'; });
    } else if (data.ice) {
      peer.pc.addIceCandidate(new RTCIceCandidate(data.ice)).catch(function () {});
    }
  }

  // -------------------------------------------------------------------------
  // Estado del shell
  // -------------------------------------------------------------------------
  var mode = 'lobby';        // lobby | menu | play | result
  var game = null;
  var pick = 0;
  var stickLatch = [false, false];
  var result = null, resultAt = 0;

  var cv = el('cv'), cx = cv.getContext('2d');
  function size() { cv.width = cv.clientWidth; cv.height = cv.clientHeight; }
  window.addEventListener('resize', size);

  // API que ve cada juego
  var api = {
    pads: pads,
    joined: joined,
    rtt: rtt,
    colors: window.Arcade.COLORS,
    pressed: function (slot, btn) { return edges[slot][btn]; },
    anyPressed: function (btn) { return edges[0][btn] || edges[1][btn]; },
    count: function () { return (joined[0] ? 1 : 0) + (joined[1] ? 1 : 0); },
    finish: function (text, winner) {
      result = { text: text, winner: winner === undefined ? -1 : winner };
      resultAt = performance.now();
      mode = 'result';
    }
  };

  function computeEdges() {
    for (var i = 0; i < 2; i++) {
      var p = pads[i], q = prev[i];
      edges[i].a = !!(p && p.a) && !(q && q.a);
      edges[i].b = !!(p && p.b) && !(q && q.b);
      prev[i] = p ? { a: p.a, b: p.b } : null;
    }
  }

  // -------------------------------------------------------------------------
  // Menú
  // -------------------------------------------------------------------------
  function menuStep() {
    var games = window.Arcade.games;

    // El stick funciona por flancos: si no, un empujón recorre la lista entera.
    for (var i = 0; i < 2; i++) {
      var p = pads[i];
      if (!p) continue;
      if (Math.abs(p.y) > 0.55) {
        if (!stickLatch[i]) {
          pick = (pick + (p.y > 0 ? 1 : -1) + games.length) % games.length;
          stickLatch[i] = true;
        }
      } else if (Math.abs(p.y) < 0.3) stickLatch[i] = false;
    }

    if (api.anyPressed('a') && games.length) {
      game = games[pick];
      game.init(api);
      mode = 'play';
    }
  }

  function menuDraw(W, H) {
    var games = window.Arcade.games;
    cx.fillStyle = window.Arcade.BG;
    cx.fillRect(0, 0, W, H);

    cx.textAlign = 'center';
    cx.textBaseline = 'top';
    cx.fillStyle = window.Arcade.MUTED;
    cx.font = '400 ' + Math.round(H * 0.032) + 'px "Helvetica Neue", Arial, sans-serif';
    cx.fillText('Stick arriba y abajo para elegir · A para jugar', W / 2, H * 0.06);

    var top = H * 0.20, rowH = H * 0.17;
    for (var i = 0; i < games.length; i++) {
      var y = top + i * rowH;
      var on = i === pick;
      cx.fillStyle = on ? window.Arcade.PANEL : 'rgba(24,33,80,0.45)';
      cx.fillRect(W * 0.18, y, W * 0.64, rowH * 0.82);
      if (on) {
        cx.fillStyle = window.Arcade.COLORS[0];
        cx.fillRect(W * 0.18, y, W * 0.008, rowH * 0.82);
      }
      cx.textAlign = 'left';
      cx.fillStyle = on ? window.Arcade.INK : window.Arcade.MUTED;
      cx.font = '700 ' + Math.round(H * 0.055) + 'px "Helvetica Neue", Arial, sans-serif';
      cx.fillText(games[i].name, W * 0.22, y + rowH * 0.14);
      cx.fillStyle = window.Arcade.MUTED;
      cx.font = '400 ' + Math.round(H * 0.028) + 'px "Helvetica Neue", Arial, sans-serif';
      cx.fillText(games[i].hint, W * 0.22, y + rowH * 0.48);
    }

    cx.textAlign = 'right';
    cx.fillStyle = window.Arcade.MUTED;
    cx.font = '400 ' + Math.round(H * 0.026) + 'px "Courier New", monospace';
    var line = [];
    for (var k = 0; k < 2; k++) if (joined[k]) line.push('J' + (k + 1) + (rtt[k] !== null ? ' ' + rtt[k] + 'ms' : ''));
    cx.fillText(line.join('   '), W * 0.96, H * 0.06);
  }

  // -------------------------------------------------------------------------
  // Resultado
  // -------------------------------------------------------------------------
  function resultStep() {
    if (performance.now() - resultAt > 1200 && api.anyPressed('a')) { mode = 'menu'; game = null; }
  }

  function resultDraw(W, H) {
    cx.fillStyle = 'rgba(14,22,51,0.86)';
    cx.fillRect(0, H * 0.26, W, H * 0.44);
    cx.textAlign = 'center';
    cx.textBaseline = 'top';
    cx.fillStyle = result.winner >= 0 ? window.Arcade.COLORS[result.winner] : window.Arcade.INK;
    cx.font = '700 ' + Math.round(H * 0.085) + 'px "Helvetica Neue", Arial, sans-serif';
    cx.fillText(result.text, W / 2, H * 0.35);
    cx.fillStyle = window.Arcade.MUTED;
    cx.font = '400 ' + Math.round(H * 0.036) + 'px "Helvetica Neue", Arial, sans-serif';
    cx.fillText('A para volver al menú', W / 2, H * 0.55);
  }

  // -------------------------------------------------------------------------
  // Bucle
  // -------------------------------------------------------------------------
  var last = performance.now();
  (function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    computeEdges();

    if (mode !== 'lobby') {
      var W = cv.width, H = cv.height;
      if (mode === 'menu') { menuStep(); menuDraw(W, H); }
      else if (mode === 'play') { game.step(dt, api); game.draw(cx, W, H, api); }
      else if (mode === 'result') { game.draw(cx, W, H, api); resultStep(); resultDraw(W, H); }
    }
    requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
