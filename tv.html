<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrera</title>
<style>
  :root {
    --bg: #0E1633;
    --panel: #182150;
    --edge: #2C3873;
    --ink: #E6EAF7;
    --muted: #8B96C4;
    --p1: #FFB020;
    --p2: #3FE0C8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  #lobby { padding: 6vh 5vw; text-align: center; }
  .lead { font-size: 2.3vw; color: var(--muted); margin-bottom: 1vh; }
  #url { font-size: 3.8vw; font-weight: 700; color: var(--p2); margin-bottom: 3vh; word-break: break-all; }
  #code {
    font-family: "Courier New", monospace; font-size: 14vw; font-weight: 700;
    line-height: 1; letter-spacing: 0.12em; text-indent: 0.12em; margin-bottom: 3vh;
  }
  .seats { display: flex; justify-content: center; }
  .seat { width: 24vw; padding: 1.6vh 1vw; margin: 0 1vw; background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; }
  .seat.p1 { border-left: 0.8vw solid var(--p1); }
  .seat.p2 { border-left: 0.8vw solid var(--p2); }
  .who { font-size: 1.9vw; font-weight: 700; }
  .st { font-size: 1.4vw; color: var(--muted); margin-top: 0.5vh; }
  #call { margin-top: 3vh; font-size: 2vw; color: var(--muted); min-height: 3vh; }

  #game { display: none; position: relative; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<div id="lobby">
  <div class="lead">Abre esta dirección en el celular</div>
  <div id="url">…</div>
  <div id="code">····</div>
  <div class="seats">
    <div class="seat p1"><div class="who">Jugador 1</div><div class="st" id="st0">esperando</div></div>
    <div class="seat p2"><div class="who">Jugador 2</div><div class="st" id="st1">esperando</div></div>
  </div>
  <div id="call"></div>
</div>

<div id="game"><canvas id="cv"></canvas></div>

<script>
(function () {
  'use strict';

  var el = function (id) { return document.getElementById(id); };
  var ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

  var peers  = [null, null];
  var pads   = [null, null];
  var rtt    = [null, null];
  var joined = [false, false];

  el('url').textContent = location.host + '/pad';

  ws.onopen = function () { ws.send('{"t":"host"}'); };

  ws.onmessage = function (ev) {
    var text = ev.data;
    if (text.lastIndexOf('{"t":"r"', 0) === 0) {
      var inp = JSON.parse(text);
      pads[inp.p] = inp;
      if (inp.r !== undefined) rtt[inp.p] = inp.r;
      return;
    }
    var msg = JSON.parse(text);
    if (msg.t === 'room') { el('code').textContent = msg.code; return; }
    if (msg.t === 'peer') { el('st' + msg.slot).textContent = 'conectando'; startRTC(msg.slot); return; }
    if (msg.t === 'left') { el('st' + msg.slot).textContent = 'se fue'; joined[msg.slot] = false; pads[msg.slot] = null; return; }
    if (msg.t === 'signal') { onSignal(msg.slot, msg.data); return; }
  };

  function ready(slot) {
    if (joined[slot]) return;
    joined[slot] = true;
    el('st' + slot).textContent = 'listo';
    el('call').textContent = 'Aprieta A para partir';
  }

  function startRTC(slot) {
    if (typeof RTCPeerConnection === 'undefined') { el('st' + slot).textContent = 'sin WebRTC'; ready(slot); return; }
    var pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    peers[slot] = { pc: pc };

    pc.onicecandidate = function (e) {
      if (e.candidate) ws.send(JSON.stringify({ t: 'signal', slot: slot, data: { ice: e.candidate } }));
    };
    pc.oniceconnectionstatechange = function () {
      if (pc.iceConnectionState === 'failed') { el('st' + slot).textContent = 'por el servidor'; ready(slot); }
    };
    pc.ondatachannel = function (e) {
      var dc = e.channel;
      dc.onopen = function () { ready(slot); };
      dc.onmessage = function (m) {
        var p = JSON.parse(m.data);
        pads[slot] = p;
        if (p.r !== undefined) rtt[slot] = p.r;
        dc.send('{"s":' + p.s + '}');
      };
    };
    setTimeout(function () {
      if (!joined[slot]) { el('st' + slot).textContent = 'por el servidor'; ready(slot); }
    }, 6000);
  }

  function onSignal(slot, data) {
    var peer = peers[slot];
    if (!peer) return;
    if (data.sdp) {
      peer.pc.setRemoteDescription(new RTCSessionDescription(data.sdp))
        .then(function () { return peer.pc.createAnswer(); })
        .then(function (a) { return peer.pc.setLocalDescription(a); })
        .then(function () { ws.send(JSON.stringify({ t: 'signal', slot: slot, data: { sdp: peer.pc.localDescription } })); })
        .catch(function () { el('st' + slot).textContent = 'falló la conexión directa'; });
    } else if (data.ice) {
      peer.pc.addIceCandidate(new RTCIceCandidate(data.ice)).catch(function () {});
    }
  }

  // ==========================================================================
  // JUEGO
  //
  // Mundo en metros. La cámara sigue a quien va adelante, así que quedarse
  // atrás te empuja fuera de pantalla. Ahí está toda la tensión: no compites
  // contra un cronómetro, compites contra el encuadre.
  // ==========================================================================
  var VIEW = 120;                      // metros visibles de alto
  var FINISH = 1800;                   // largo de la carrera
  var ROAD_L = 0.12, ROAD_R = 0.88;    // bordes de la pista

  var ACCEL = 22, BRAKE = 50, DRAG = 6, VMAX = 58;
  // El pasto tiene que frenar, no matar: si el rozamiento supera a ACCEL el
  // auto se detiene para siempre y no hay forma de volver a la pista.
  var OFFROAD_DRAG = 14, OFFROAD_VMAX = 24;
  var STEER = 0.85;                    // fracción de pista por segundo a tope
  var CAR_W = 0.075, CAR_L = 7.5;
  var SPIN_TIME = 0.9;

  var phase = 'lobby';                 // lobby | countdown | race | done
  var startAt = 0, elapsed = 0, winner = -1;

  function newCar(i) {
    return { x: i === 0 ? 0.36 : 0.64, y: 0, v: 0, spin: 0, hits: 0, finished: 0 };
  }
  var cars = [newCar(0), newCar(1)];

  // Obstáculos deterministas: el mismo sembrado para los dos, si no la carrera
  // no sería justa. Se densifican hacia el final.
  var obstacles = [];
  (function seed() {
    var s = 12345;
    function rnd() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }
    var y = 150;
    while (y < FINISH - 70) {
      var n = rnd() < 0.3 + 0.35 * (y / FINISH) ? 2 : 1;
      var used = [];
      for (var k = 0; k < n; k++) {
        var x, tries = 0, ok;
        do {
          x = ROAD_L + 0.07 + rnd() * (ROAD_R - ROAD_L - 0.14);
          ok = true;
          for (var u = 0; u < used.length; u++) if (Math.abs(used[u] - x) < 0.17) ok = false;
          tries++;
        } while (!ok && tries < 8);
        used.push(x);
        obstacles.push({ x: x, y: y, hit: [false, false] });
      }
      var gap = 48 - 24 * (y / FINISH);
      y += gap * (0.7 + rnd() * 0.6);
    }
  })();

  function anyJoined() { return joined[0] || joined[1]; }

  function startRace() {
    cars = [newCar(0), newCar(1)];
    for (var i = 0; i < obstacles.length; i++) obstacles[i].hit = [false, false];
    winner = -1;
    elapsed = 0;
    phase = 'countdown';
    startAt = performance.now() + 3200;
    el('lobby').style.display = 'none';
    el('game').style.display = 'block';
    size();
  }

  function leaderY() {
    var m = 0;
    for (var i = 0; i < 2; i++) if (joined[i] && cars[i].y > m) m = cars[i].y;
    return m;
  }

  function step(dt) {
    var pressA = (pads[0] && pads[0].a) || (pads[1] && pads[1].a);

    if (phase === 'lobby') { if (anyJoined() && pressA) startRace(); return; }
    if (phase === 'done') {
      if (pressA && performance.now() - startAt > 1500) startRace();
      return;
    }
    if (phase === 'countdown') {
      if (performance.now() >= startAt) { phase = 'race'; startAt = performance.now(); }
      return;
    }

    elapsed = (performance.now() - startAt) / 1000;
    var camY = leaderY() - VIEW * 0.32;

    for (var i = 0; i < 2; i++) {
      if (!joined[i]) continue;
      var c = cars[i], p = pads[i];
      if (c.finished) continue;

      var offroad = c.x < ROAD_L || c.x > ROAD_R;

      if (c.spin > 0) {
        c.spin -= dt;
        c.v -= DRAG * 2.5 * dt;
      } else {
        if (p && p.a) c.v += ACCEL * dt;
        if (p && p.b) c.v -= BRAKE * dt;
        if (!p || (!p.a && !p.b)) c.v -= DRAG * dt;
        if (offroad) c.v -= OFFROAD_DRAG * dt;

        // Girar necesita velocidad. Detenido no se dobla, como un auto real.
        var grip = Math.min(1, c.v / 22);
        if (p) c.x += p.x * STEER * grip * dt;
      }

      var top = offroad ? OFFROAD_VMAX : VMAX;
      if (c.v > top) c.v = top;
      if (c.v < 0) c.v = 0;

      c.x = Math.max(0.03, Math.min(0.97, c.x));
      c.y += c.v * dt;

      // Marcamos el choque por jugador, si no el segundo auto pasaría limpio
      // por un cono que ya reventó el primero.
      for (var j = 0; j < obstacles.length; j++) {
        var o = obstacles[j];
        if (o.hit[i]) continue;
        if (Math.abs(o.y - c.y) > CAR_L) continue;
        if (Math.abs(o.x - c.x) > CAR_W) continue;
        o.hit[i] = true;
        c.hits++;
        c.spin = SPIN_TIME;
        c.v *= 0.3;
      }

      if (c.y < camY) { c.y = camY; c.v *= 0.55; }

      if (c.y >= FINISH && !c.finished) {
        c.finished = elapsed;
        if (winner === -1) { winner = i; phase = 'done'; startAt = performance.now(); }
      }
    }
  }

  // ==========================================================================
  // Render
  // ==========================================================================
  var cv = el('cv'), cx = cv.getContext('2d');
  function size() { cv.width = cv.clientWidth; cv.height = cv.clientHeight; }
  window.addEventListener('resize', size);

  var COLORS = ['#FFB020', '#3FE0C8'];

  function draw() {
    var W = cv.width, H = cv.height;
    var camY = leaderY() - VIEW * 0.32;
    var mPx = H / VIEW;
    function toY(worldY) { return H - (worldY - camY) * mPx; }

    cx.fillStyle = '#101B26';
    cx.fillRect(0, 0, W, H);

    cx.fillStyle = '#182150';
    cx.fillRect(ROAD_L * W, 0, (ROAD_R - ROAD_L) * W, H);

    cx.fillStyle = '#2C3873';
    cx.fillRect(ROAD_L * W - W * 0.006, 0, W * 0.006, H);
    cx.fillRect(ROAD_R * W, 0, W * 0.006, H);

    // Líneas de carril ancladas al mundo: son las que dan sensación de avance.
    cx.strokeStyle = '#2C3873';
    cx.lineWidth = Math.max(2, W * 0.004);
    var dash = 9;
    var first = Math.floor(camY / (dash * 2)) * (dash * 2);
    for (var ly = first; ly < camY + VIEW + dash * 2; ly += dash * 2) {
      for (var lane = 1; lane <= 2; lane++) {
        var lx = (ROAD_L + (ROAD_R - ROAD_L) * (lane / 3)) * W;
        cx.beginPath();
        cx.moveTo(lx, toY(ly));
        cx.lineTo(lx, toY(ly + dash));
        cx.stroke();
      }
    }

    if (FINISH > camY - 10 && FINISH < camY + VIEW + 10) {
      var fy = toY(FINISH), sq = W * 0.02;
      cx.fillStyle = '#E6EAF7';
      for (var q = 0; q * sq < (ROAD_R - ROAD_L) * W; q++) {
        cx.fillRect(ROAD_L * W + q * sq, fy - (q % 2 === 0 ? sq : sq * 2), sq, sq);
      }
    }

    for (var j = 0; j < obstacles.length; j++) {
      var o = obstacles[j];
      if (o.y < camY - 20 || o.y > camY + VIEW + 20) continue;
      var oy = toY(o.y), ox = o.x * W;
      var ow = CAR_W * W * 0.95, oh = CAR_L * mPx * 0.85;
      cx.fillStyle = '#FF6B7A';
      cx.beginPath();
      cx.moveTo(ox, oy - oh / 2);
      cx.lineTo(ox + ow / 2, oy + oh / 2);
      cx.lineTo(ox - ow / 2, oy + oh / 2);
      cx.fill();
    }

    for (var i = 0; i < 2; i++) {
      if (!joined[i]) continue;
      var c = cars[i];
      if (c.spin > 0 && Math.floor(c.spin * 12) % 2 === 0) continue;   // parpadeo
      var y = toY(c.y), x = c.x * W, w = CAR_W * W, l = CAR_L * mPx;

      cx.fillStyle = COLORS[i];
      cx.fillRect(x - w / 2, y - l / 2, w, l);
      cx.fillStyle = 'rgba(14,22,51,0.55)';
      cx.fillRect(x - w * 0.32, y - l * 0.18, w * 0.64, l * 0.34);

      if (pads[i] && pads[i].b && c.v > 1) {
        cx.fillStyle = '#FF6B7A';
        cx.fillRect(x - w / 2, y + l / 2 - l * 0.12, w, l * 0.12);
      }
    }

    hud(W, H);
  }

  function hud(W, H) {
    var bw = W * 0.016, bh = H * 0.62, bx = W * 0.035, by = H * 0.2;
    for (var i = 0; i < 2; i++) {
      if (!joined[i]) continue;
      var x = bx + i * bw * 2.2;
      cx.fillStyle = '#182150';
      cx.fillRect(x, by, bw, bh);
      var f = Math.min(1, cars[i].y / FINISH);
      cx.fillStyle = COLORS[i];
      cx.fillRect(x, by + bh * (1 - f), bw, bh * f);
    }

    cx.textBaseline = 'top';
    cx.textAlign = 'right';
    for (var k = 0; k < 2; k++) {
      if (!joined[k]) continue;
      var ty = H * 0.04 + k * H * 0.075;
      cx.fillStyle = COLORS[k];
      cx.font = '700 ' + Math.round(H * 0.05) + 'px "Courier New", monospace';
      cx.fillText(Math.round(cars[k].v) + ' km/h', W - W * 0.03, ty);
      cx.fillStyle = '#8B96C4';
      cx.font = '400 ' + Math.round(H * 0.024) + 'px "Courier New", monospace';
      cx.fillText('J' + (k + 1) + '  golpes ' + cars[k].hits +
                  (rtt[k] !== null ? '   ' + rtt[k] + 'ms' : ''),
                  W - W * 0.03, ty + H * 0.053);
    }

    cx.textAlign = 'center';
    if (phase === 'countdown') {
      var left = Math.ceil((startAt - performance.now()) / 1000);
      cx.fillStyle = '#E6EAF7';
      cx.font = '700 ' + Math.round(H * 0.28) + 'px "Helvetica Neue", Arial, sans-serif';
      cx.fillText(left > 0 ? left : 'YA', W / 2, H * 0.32);
    }

    if (phase === 'race') {
      cx.fillStyle = '#8B96C4';
      cx.font = '400 ' + Math.round(H * 0.034) + 'px "Courier New", monospace';
      cx.fillText(elapsed.toFixed(1) + ' s', W / 2, H * 0.04);
    }

    if (phase === 'done') {
      cx.fillStyle = 'rgba(14,22,51,0.85)';
      cx.fillRect(0, H * 0.26, W, H * 0.44);
      cx.fillStyle = COLORS[winner];
      cx.font = '700 ' + Math.round(H * 0.1) + 'px "Helvetica Neue", Arial, sans-serif';
      cx.fillText('Gana el jugador ' + (winner + 1), W / 2, H * 0.32);
      cx.fillStyle = '#E6EAF7';
      cx.font = '400 ' + Math.round(H * 0.042) + 'px "Courier New", monospace';
      cx.fillText(cars[winner].finished.toFixed(1) + ' s    ' + cars[winner].hits + ' golpes', W / 2, H * 0.46);
      cx.fillStyle = '#8B96C4';
      cx.font = '400 ' + Math.round(H * 0.036) + 'px "Helvetica Neue", Arial, sans-serif';
      cx.fillText('Aprieta A para otra carrera', W / 2, H * 0.57);
    }
  }

  var last = performance.now();
  (function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    step(dt);
    if (phase !== 'lobby') draw();
    requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
